<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Photostream</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="An endless stream of random photos. Save the ones you like to your favorites and view them full size."
    />
    <link href="favicon.ico" rel="icon" type="image/x-icon" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
    <!--
      A preconnect tells the browser to do DNS + TCP + TLS to a host straight away, while it is still
      parsing this file, instead of waiting until the first request needs that host.

      Picsum serves every photo in two hops: picsum.photos answers with a 302, and
      fastly.picsum.photos delivers the bytes. Without these two lines the first thumbnail pays a full
      connection setup twice over (~100-300ms each) before a single photo arrives.

      Also required by NgOptimizedImage, which logs NG02956 for any `priority` image whose origin
      has no preconnect.
    -->
    <link href="https://picsum.photos" rel="preconnect" />
    <link href="https://fastly.picsum.photos" rel="preconnect" />
    <!-- eslint-disable max-len -- a font URL cannot be wrapped -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@1&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&family=Spline+Sans+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- eslint-enable max-len -->
  </head>
  <body>
    <ps-root></ps-root>
  </body>
</html>
